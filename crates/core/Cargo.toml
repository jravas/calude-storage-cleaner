[package]
name = "cleaner-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Scans Claude Code worktrees, sessions and caches and performs safe cleanup."

[lib]
path = "src/lib.rs"

[[bin]]
name = "scan"
path = "src/bin/scan.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
rayon = "1"
trash = "5"
jiff = "0.2"
libc = "0.2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
